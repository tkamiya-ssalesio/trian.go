<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trian.go | 三角比トレーニング</title>
  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- canvas-confetti for effects -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=27">
</head>
<body>

  <div class="container">
    <div class="apple-card" id="app-card">

      <!-- App Header (Hidden on Title Screen) -->
      <header id="app-header" class="hidden">
        <button class="back-btn" id="back-btn">◀ 戻る</button>
        <h1 id="header-title">trian.go</h1>
        <div class="header-placeholder"></div>
      </header>

      <!-- 1. Title Screen -->
      <div id="title-screen" class="title-screen">
        <div class="title-logo">trian.go</div>
        <div class="title-subtitle">三角比（sin・cos・tan）特訓アプリ</div>

        <div class="menu-buttons">
          <button class="menu-btn" id="go-to-tutorial-btn">
            <span class="icon">📖</span>
            <div class="btn-text">
              <h3>やり方を学ぶ</h3>
              <p>三角比の定義をスライドで理解する</p>
            </div>
          </button>
          <button class="menu-btn" id="go-to-training-btn">
            <span class="icon">⚡</span>
            <div class="btn-text">
              <h3>トレーニングを開始する</h3>
              <p>ゲームモードを選び，問題を選んでスタート</p>
            </div>
          </button>
        </div>
        <div class="app-footer">v1.5.0 | Produced by T.Kamiya</div>
      </div>

      <!-- 2. Tutorial Select Screen -->
      <div id="tutorial-select-screen" class="hidden">
        <h2 class="screen-title">何を学びますか？</h2>
        <div class="menu-buttons">
          <button class="menu-btn tutorial-btn" data-tutorial="define">
            <span class="icon">📐</span>
            <div class="btn-text">
              <h3>三角比の定義</h3>
              <p>辺の呼び方と sin・cos・tan，向きが変わったときの見方</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="similar">
            <span class="icon">🔍</span>
            <div class="btn-text">
              <h3>大きさによらない</h3>
              <p>三角比は角 θ の大きさだけで決まる（相似）</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="answer">
            <span class="icon">✍️</span>
            <div class="btn-text">
              <h3>2辺から求める・答え方</h3>
              <p>三平方の定理と，約分・√・有理化のルール</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="relation">
            <span class="icon">🔗</span>
            <div class="btn-text">
              <h3>三角比の相互関係</h3>
              <p>3つの公式と，1つの値から残りの2つを求める手順</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="famous">
            <span class="icon">🔺</span>
            <div class="btn-text">
              <h3>有名角・余角の三角比</h3>
              <p>30°・45°・60° の三角比と，90° − θ の三角比</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="extend">
            <span class="icon">🌙</span>
            <div class="btn-text">
              <h3>三角比の拡張（0°〜180°）</h3>
              <p>なぜ座標を使うのか，なぜ単位円なのかを動かして確かめる</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="wide">
            <span class="icon">🎯</span>
            <div class="btn-text">
              <h3>三角方程式・直線の傾き・相互関係（0°〜180°）</h3>
              <p>単位円で解く三角方程式，傾きと tan θ，鈍角のときの符号</p>
            </div>
          </button>
          <button class="menu-btn tutorial-btn" data-tutorial="apply">
            <span class="icon">🌲</span>
            <div class="btn-text">
              <h3>三角比の活用</h3>
              <p>仰角・俯角，どの三角比を使うか，表の引き方と答え方</p>
            </div>
          </button>
        </div>
      </div>

      <!-- 3. Tutorial Slideshow Screen -->
      <div id="tutorial-screen" class="hidden">
        <h2 class="slide-title" id="tutorial-title">チュートリアル</h2>
        <div class="tutorial-card">
          <div id="tutorial-content"></div>
        </div>
        <div class="tutorial-nav-btns">
          <button class="secondary-btn" id="tutorial-prev-btn">◀ 前へ</button>
          <div class="slide-indicator" id="slide-indicator">1 / 3</div>
          <button class="primary-btn" id="tutorial-next-btn">次へ ▶</button>
        </div>
      </div>

      <!-- 5. Game Mode Select Screen -->
      <div id="mode-select-screen" class="hidden">
        <h2 class="screen-title">ゲームモードを選択</h2>
        <div class="menu-buttons">
          <button class="menu-btn game-mode-btn" data-mode="practice">
            <span class="icon">♾️</span>
            <div class="btn-text">
              <h3>練習モード</h3>
              <p>制限時間なし．解説を見ながらじっくりトレーニング</p>
            </div>
          </button>
          <button class="menu-btn game-mode-btn" data-mode="timeAttack">
            <span class="icon">⏱️</span>
            <div class="btn-text">
              <h3>タイムアタック</h3>
              <p>5問正解するまでの最速タイムを競う（誤答ペナルティあり）</p>
            </div>
          </button>
          <button class="menu-btn game-mode-btn" data-mode="survival">
            <span class="icon">❤️</span>
            <div class="btn-text">
              <h3>サバイバル</h3>
              <p>ライフは3つ．間違えるたびにライフ減少，どこまで進めるか</p>
            </div>
          </button>
          <button class="menu-btn game-mode-btn" data-mode="scoreAttack">
            <span class="icon">🔥</span>
            <div class="btn-text">
              <h3>スコアアタック</h3>
              <p>制限時間90秒．コンボを繋げてハイスコアを目指せ！</p>
            </div>
          </button>
        </div>
      </div>

      <!-- 6. Category Select Screen（モードを選んだあと．選ぶとすぐ開始） -->
      <div id="intro-screen" class="hidden">
        <div class="mode-note">
          <span class="step-badge">ルール</span>
          <span class="mode-note-name" id="intro-mode-name"></span>
          <p id="intro-mode-desc"></p>
        </div>
        <h2 class="screen-title">問題を選んでスタート</h2>

        <section class="cat-section">
          <div class="cat-head">
            <h3>三角比の定義</h3>
            <div class="orient-setting">
              <span class="orient-label">三角形の向き</span>
              <div class="seg" id="orient-toggle">
                <button type="button" class="seg-btn" data-fixed="0">毎回変わる</button>
                <button type="button" class="seg-btn" data-fixed="1">いつも同じ（θ 左下）</button>
              </div>
            </div>
          </div>
          <div class="menu-buttons">
            <button class="menu-btn category-btn" data-category="three">
              <span class="icon">🔰</span>
              <div class="btn-text">
                <h3>① 3辺がわかる三角形</h3>
                <p>3辺の長さから sin・cos・tan を求める</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="two">
              <span class="icon">📏</span>
              <div class="btn-text">
                <h3>② 2辺から求める</h3>
                <p>三平方の定理で残りの辺を求めてから三角比へ</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="mix">
              <span class="icon">🔀</span>
              <div class="btn-text">
                <h3>③ ミックス</h3>
                <p>①と②がランダムに出題される</p>
              </div>
            </button>
          </div>
        </section>

        <section class="cat-section">
          <div class="cat-head">
            <h3>三角比の相互関係</h3>
          </div>
          <div class="menu-buttons">
            <button class="menu-btn category-btn" data-category="relation">
              <span class="icon">🔗</span>
              <div class="btn-text">
                <h3>⑦ 1つから残りの2つを求める</h3>
                <p>sin・cos・tan のうち1つの値から，残りの2つを求める（θ は鋭角）</p>
              </div>
            </button>
          </div>
        </section>

        <section class="cat-section">
          <div class="cat-head">
            <h3>有名角・余角の三角比</h3>
          </div>
          <div class="menu-buttons">
            <button class="menu-btn category-btn" data-category="famous">
              <span class="icon">🔺</span>
              <div class="btn-text">
                <h3>⑧ 30°・45°・60° の三角比</h3>
                <p>値を答える問題と，値から角を答える問題（θ は鋭角）</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="comp">
              <span class="icon">🔄</span>
              <div class="btn-text">
                <h3>⑨ 45° 以下の角で表す</h3>
                <p>sin64° = cos26°，tan83° = 1/tan7° のように書きかえる</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="expr">
              <span class="icon">🧮</span>
              <div class="btn-text">
                <h3>⑩ 式の値</h3>
                <p>余角の関係を使って，式の値を求める</p>
              </div>
            </button>
          </div>
        </section>

        <section class="cat-section">
          <div class="cat-head">
            <h3>三角比の拡張（0° ≦ θ ≦ 180°）</h3>
            <p class="cat-note">負の答えは「−」ボタンで入力します</p>
          </div>
          <div class="menu-buttons">
            <button class="menu-btn category-btn" data-category="wideVal">
              <span class="icon">🌙</span>
              <div class="btn-text">
                <h3>⑪ 0°〜180° の三角比</h3>
                <p>sin150°，cos120°，tan135° など．0°・90°・180° も</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="wideComp">
              <span class="icon">🔄</span>
              <div class="btn-text">
                <h3>⑫ 鈍角を 45° 以下の角で表す</h3>
                <p>sin156° = sin24°，tan117° = −1/tan27° のように書きかえる</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="eq">
              <span class="icon">🎯</span>
              <div class="btn-text">
                <h3>⑬ 三角方程式</h3>
                <p>sinθ = 1/√2，2cosθ = −√3 などを満たす θ（答えが2つのことも）</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="slope">
              <span class="icon">📈</span>
              <div class="btn-text">
                <h3>⑭ 直線の傾き</h3>
                <p>直線と x 軸の正の向きとのなす角 ⇔ 傾き</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="rel2">
              <span class="icon">🔗</span>
              <div class="btn-text">
                <h3>⑮ 1つから残りの2つ（0°〜180°）</h3>
                <p>鈍角のときの符号に注意して，残りの2つを求める</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="expr2">
              <span class="icon">🧮</span>
              <div class="btn-text">
                <h3>⑯ 式の値（180° − θ）</h3>
                <p>sin80°cos170° − cos80°sin170° などの値</p>
              </div>
            </button>
          </div>
        </section>

        <section class="cat-section">
          <div class="cat-head">
            <h3>三角比の活用</h3>
            <p class="cat-note">教科書の三角比の表を使って計算します</p>
          </div>
          <div class="menu-buttons">
            <button class="menu-btn category-btn" data-category="applyLen">
              <span class="icon">📐</span>
              <div class="btn-text">
                <h3>④ 長さを求める</h3>
                <p>木の高さ・坂・はしご・見下ろした距離など</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="applyAng">
              <span class="icon">🧭</span>
              <div class="btn-text">
                <h3>⑤ 角度を求める</h3>
                <p>勾配（%・‰）や辺の長さから，表で角度を引く</p>
              </div>
            </button>
            <button class="menu-btn category-btn" data-category="applyMix">
              <span class="icon">🎯</span>
              <div class="btn-text">
                <h3>⑥ 活用ミックス</h3>
                <p>④と⑤がランダムに出題される</p>
              </div>
            </button>
          </div>
        </section>

        <section class="cat-section mix-section">
          <div class="cat-head">
            <h3>総合ミックス</h3>
            <p class="cat-note">選んだ単元の問題がまざって出ます</p>
          </div>
          <div class="unit-chips" id="mix-units">
            <button type="button" class="unit-chip" data-unit="define">定義</button>
            <button type="button" class="unit-chip" data-unit="relation">相互関係</button>
            <button type="button" class="unit-chip" data-unit="famous">有名角・余角</button>
            <button type="button" class="unit-chip" data-unit="wide">0°〜180°</button>
            <button type="button" class="unit-chip" data-unit="apply">活用</button>
          </div>
          <div class="menu-buttons">
            <button class="menu-btn category-btn" data-category="allMix">
              <span class="icon">🌈</span>
              <div class="btn-text">
                <h3>⑰ 総合ミックス</h3>
                <p id="mix-desc">①〜⑯ の問題の種類がランダムに出題される</p>
              </div>
            </button>
          </div>
        </section>
      </div>

      <!-- 7. Problem Area -->
      <div id="problem-area" class="hidden">
        <div class="stats-bar">
          <span id="stats-left"></span>
          <span id="stats-right"></span>
        </div>

        <div id="game-view">
          <div class="prompt-text" id="problem-prompt"></div>
          <button class="link-btn hidden" id="show-figure-btn">📐 図を見る</button>
          <div class="figure" id="figure"></div>
          <div class="answer-list" id="answer-list"></div>

          <div class="explain hidden" id="explain-box"></div>

          <div class="actions" id="action-area">
            <button class="primary-btn" id="judge-btn">判定する</button>
            <div class="sub-actions" id="practice-actions">
              <button class="link-btn hidden" id="show-explain-btn">💡 解説を見る</button>
              <button class="link-btn hidden" id="next-btn">次の問題へ ▶</button>
            </div>
          </div>
        </div>

        <div id="result-view" class="result-view hidden"></div>
      </div>

    </div>
  </div>

  <div class="feedback" id="feedback-toast"></div>

  <script defer src="core.js?v=27"></script>
  <script defer src="relation.js?v=27"></script>
  <script defer src="famous.js?v=27"></script>
  <script defer src="wide.js?v=27"></script>
  <script defer src="apply.js?v=27"></script>
  <script defer src="extend.js?v=27"></script>
  <script defer src="mix.js?v=27"></script>
  <script defer src="script.js?v=27"></script>
</body>
</html>
